<text x="80.0" y="454.0" font-size="12.5" font-weight="700" fill="#a15c07" text-anchor="start" letter-spacing="1.2">STATE LIVES ONLY HERE</text>
<rect x="200.0" y="470.0" width="260.0" height="74.0" rx="12" fill="#ffffff" stroke="#a15c07" stroke-width="1.5"/>
<text x="330.0" y="504.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Database</text>
<text x="330.0" y="525.0" font-size="14.5" font-weight="400" fill="#5b6472" text-anchor="middle">records · vectors · maps</text>
<rect x="540.0" y="470.0" width="260.0" height="74.0" rx="12" fill="#ffffff" stroke="#a15c07" stroke-width="1.5"/>
<text x="670.0" y="504.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Object storage</text>
<text x="670.0" y="525.0" font-size="14.5" font-weight="400" fill="#5b6472" text-anchor="middle">files · images · models</text>
<line x1="410.0" y1="284.0" x2="410.0" y2="468.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="400.0" y="410.0" font-size="12.5" font-weight="400" fill="#5b6472" text-anchor="end">read / write</text>
<line x1="780.0" y1="382.0" x2="780.0" y2="468.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="740.0" y1="382.0" x2="440.0" y2="468.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="70.0" y="108.0" width="15.0" height="15.0" rx="3" fill="#d5f5ef" stroke="#0f766e" stroke-width="1.5"/>
<text x="91.0" y="120.0" font-size="13.5" font-weight="400" fill="#5b6472" text-anchor="start">stateless: safe to restart or copy</text>
<rect x="70.0" y="130.0" width="15.0" height="15.0" rx="3" fill="#fdf0d5" stroke="#a15c07" stroke-width="1.5"/>
<text x="91.0" y="142.0" font-size="13.5" font-weight="400" fill="#5b6472" text-anchor="start">holds data: back it up</text>
<rect x="70.0" y="152.0" width="15.0" height="15.0" rx="3" fill="#eee5fd" stroke="#6d32c9" stroke-width="1.5"/>
<text x="91.0" y="164.0" font-size="13.5" font-weight="400" fill="#5b6472" text-anchor="start">AI: managed API or own service</text>
</svg>
