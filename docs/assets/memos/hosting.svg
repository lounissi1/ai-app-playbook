<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">Where does my code run?</title>
<desc id="d">Four yes-or-no questions lead to PaaS web app, serverless functions, managed Kubernetes or virtual machines. If every answer is no, use the default: a managed container platform.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="639" rx="16" fill="#ffffff" stroke="#d9dee5"/>
<rect x="40.0" y="32.0" width="520.0" height="76.0" rx="12" fill="#f6f8fb" stroke="#334155" stroke-width="1.5"/>
<text x="60.0" y="64.0" font-size="18" font-weight="700" fill="#334155" text-anchor="start">1</text>
<text x="88.0" y="64.0" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start">Is it one classic web app,</text>
<text x="88.0" y="86.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">not packaged in containers?</text>
<line x1="562.0" y1="70.0" x2="646.0" y2="70.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="604.0" y="62.0" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="middle">Yes</text>
<rect x="648.0" y="36.0" width="312.0" height="68.0" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="804.0" y="66.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">PaaS web app</text>
<text x="804.0" y="88.0" font-size="13.5" font-weight="400" fill="#5b6472" text-anchor="middle">ops effort: low</text>
<line x1="300.0" y1="108.0" x2="300.0" y2="148.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="312.0" y="134.0" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="start">No</text>
<rect x="40.0" y="150.0" width="520.0" height="76.0" rx="12" fill="#f6f8fb" stroke="#334155" stroke-width="1.5"/>
<text x="60.0" y="182.0" font-size="18" font-weight="700" fill="#334155" text-anchor="start">2</text>
<text x="88.0" y="182.0" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start">Is it mostly small functions</text>
<text x="88.0" y="204.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">triggered by events?</text>
<line x1="562.0" y1="188.0" x2="646.0" y2="188.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="604.0" y="180.0" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="middle">Yes</text>
<rect x="648.0" y="154.0" width="312.0" height="68.0" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="804.0" y="184.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Serverless functions</text>
<text x="804.0" y="206.0" font-size="13.5" font-weight="400" fill="#5b6472" text-anchor="middle">ops effort: lowest</text>
<line x1="300.0" y1="226.0" x2="300.0" y2="266.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="312.0" y="252.0" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="start">No</text>
<rect x="40.0" y="268.0" width="520.0" height="76.0" rx="12" fill="#f6f8fb" stroke="#334155" stroke-width="1.5"/>
<text x="60.0" y="300.0" font-size="18" font-weight="700" fill="#334155" text-anchor="start">3</text>
<text x="88.0" y="300.0" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start">Do you need Kubernetes itself: operators,</text>
<text x="88.0" y="322.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">GPU node pools, a platform team?</text>
<line x1="562.0" y1="306.0" x2="646.0" y2="306.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="604.0" y="298.0" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="middle">Yes</text>
<rect x="648.0" y="272.0" width="312.0" height="68.0" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="804.0" y="302.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Managed Kubernetes</text>
<text x="804.0" y="324.0" font-size="13.5" font-weight="400" fill="#5b6472" text-anchor="middle">ops effort: high</text>
<line x1="300.0" y1="344.0" x2="300.0" y2="384.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="312.0" y="370.0" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="start">No</text>
<rect x="40.0" y="386.0" width="520.0" height="76.0" rx="12" fill="#f6f8fb" stroke="#334155" stroke-width="1.5"/>
<text x="60.0" y="418.0" font-size="18" font-weight="700" fill="#334155" text-anchor="start">4</text>
<text x="88.0" y="418.0" font-size="16" font-weight="600" fill="#1f2937" text-anchor="start">Does it need a full operating system</text>
<text x="88.0" y="440.0" font-size="16" font-weight="400" fill="#1f2937" text-anchor="start">that you manage yourself?</text>
<line x1="562.0" y1="424.0" x2="646.0" y2="424.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="604.0" y="416.0" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="middle">Yes</text>
<rect x="648.0" y="390.0" width="312.0" height="68.0" rx="12" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
<text x="804.0" y="420.0" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Virtual machines</text>
<text x="804.0" y="442.0" font-size="13.5" font-weight="400" fill="#5b6472" text-anchor="middle">ops effort: very high</text>
<line x1="300.0" y1="462.0" x2="300.0" y2="502.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="312.0" y="488.0" font-size="13.5" font-weight="600" fill="#5b6472" text-anchor="start">No</text>
<rect x="40" y="504" width="920" height="108" rx="14" fill="#d5f5ef" stroke="#0f766e" stroke-width="2.5"/>
<text x="500.0" y="540.0" font-size="19" font-weight="700" fill="#0f766e" text-anchor="middle">★  Managed container platform  (the default)</text>
<text x="500.0" y="566.0" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">Runs your containers, scales to zero, low ops effort</text>
<text x="500.0" y="592.0" font-size="14" font-weight="400" fill="#5b6472" text-anchor="middle">Azure Container Apps · AWS ECS on Fargate · Google Cloud Run</text>
</svg>
