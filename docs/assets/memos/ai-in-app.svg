<text x="884.0" y="262.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">answer from passages</text>
<line x1="201.0" y1="246.0" x2="415.0" y2="246.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="585.0" y1="246.0" x2="607.0" y2="246.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="777.0" y1="246.0" x2="799.0" y2="246.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="500.0" y1="128" x2="500.0" y2="214" stroke="#6d32c9" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="492.0" y="176.0" font-size="13" font-weight="600" fill="#6d32c9" text-anchor="end">same model, same version</text>
<line x1="692.0" y1="213.0" x2="692.0" y2="129.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text x="700.0" y="176.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="start">nearest passages</text>
<rect x="800.0" y="346.0" width="168.0" height="64.0" rx="10" fill="#d5f5ef" stroke="#0f766e" stroke-width="1.5"/>
<text x="884.0" y="374.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Cited answer</text>
<text x="884.0" y="394.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">with links to sources</text>
<line x1="884.0" y1="279.0" x2="884.0" y2="345.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="608.0" y="346.0" width="168.0" height="64.0" rx="10" fill="#fde8e6" stroke="#b42318" stroke-width="1.5"/>
<text x="692.0" y="374.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">“I don't know”</text>
<text x="692.0" y="394.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">when nothing matches</text>
<line x1="692.0" y1="279.0" x2="692.0" y2="345.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="684.0" y="308.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="end">no good match</text>
<rect x="32.0" y="450.0" width="456.0" height="108.0" rx="12" fill="#f6f8fb" stroke="#334155" stroke-width="1.5"/>
<text x="52.0" y="480.0" font-size="16" font-weight="700" fill="#334155" text-anchor="start">Evaluation</text>
<text x="52.0" y="506.0" font-size="14.5" font-weight="400" fill="#5b6472" text-anchor="start">Fixed test questions run in CI:</text>
<text x="52.0" y="527.0" font-size="14.5" font-weight="400" fill="#5b6472" text-anchor="start">right passage found? answer faithful? cost?</text>
<rect x="512.0" y="450.0" width="456.0" height="108.0" rx="12" fill="#f6f8fb" stroke="#334155" stroke-width="1.5"/>
<text x="532.0" y="480.0" font-size="16" font-weight="700" fill="#334155" text-anchor="start">Model serving</text>
<text x="532.0" y="506.0" font-size="14.5" font-weight="400" fill="#5b6472" text-anchor="start">Managed model API or your own container:</text>
<text x="532.0" y="527.0" font-size="14.5" font-weight="400" fill="#5b6472" text-anchor="start">pinned versions, timeouts, token limits</text>
</svg>
