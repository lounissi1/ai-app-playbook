<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title id="t">AI inside the app</title>
<desc id="d">Retrieval-augmented generation. Once per document a worker splits text into chunks, embeds them and stores the vectors. For each question the API embeds it with the same model, searches with a user filter, and the language model answers from the passages with citations, or says it doesn't know. Evaluation and model serving sit underneath.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/></marker></defs>
<rect x="0.5" y="0.5" width="999" height="589" rx="16" fill="#ffffff" stroke="#d9dee5"/>
<text x="32.0" y="50.0" font-size="13.5" font-weight="700" fill="#6d32c9" text-anchor="start" letter-spacing="1.2">INDEX</text>
<text x="94.0" y="50.0" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start">once per document, in a worker</text>
<rect x="32.0" y="64.0" width="168.0" height="64.0" rx="10" fill="#ffffff" stroke="#6d32c9" stroke-width="1.5"/>
<text x="116.0" y="92.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Documents</text>
<text x="116.0" y="112.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">PDFs, pages, notes</text>
<rect x="224.0" y="64.0" width="168.0" height="64.0" rx="10" fill="#eee5fd" stroke="#6d32c9" stroke-width="1.5"/>
<text x="308.0" y="92.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Chunks</text>
<text x="308.0" y="112.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">a few hundred words</text>
<rect x="416.0" y="64.0" width="168.0" height="64.0" rx="10" fill="#eee5fd" stroke="#6d32c9" stroke-width="1.5"/>
<text x="500.0" y="92.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Embedding model</text>
<text x="500.0" y="112.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">text → vector</text>
<rect x="608.0" y="64.0" width="168.0" height="64.0" rx="10" fill="#fdf0d5" stroke="#a15c07" stroke-width="1.5"/>
<text x="692.0" y="92.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Vector database</text>
<text x="692.0" y="112.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">chunks + vectors</text>
<line x1="201.0" y1="96.0" x2="223.0" y2="96.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="393.0" y1="96.0" x2="415.0" y2="96.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="585.0" y1="96.0" x2="607.0" y2="96.0" stroke="#5b6472" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="32.0" y="200.0" font-size="13.5" font-weight="700" fill="#6d32c9" text-anchor="start" letter-spacing="1.2">ANSWER</text>
<text x="108.0" y="200.0" font-size="14" font-weight="400" fill="#5b6472" text-anchor="start">every question, in the API</text>
<rect x="32.0" y="214.0" width="168.0" height="64.0" rx="10" fill="#ffffff" stroke="#6d32c9" stroke-width="1.5"/>
<text x="116.0" y="242.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Question</text>
<text x="116.0" y="262.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">from the user</text>
<rect x="416.0" y="214.0" width="168.0" height="64.0" rx="10" fill="#eee5fd" stroke="#6d32c9" stroke-width="1.5"/>
<text x="500.0" y="242.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Embedding model</text>
<text x="500.0" y="262.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">the same one</text>
<rect x="608.0" y="214.0" width="168.0" height="64.0" rx="10" fill="#eee5fd" stroke="#6d32c9" stroke-width="1.5"/>
<text x="692.0" y="242.0" font-size="15" font-weight="700" fill="#1f2937" text-anchor="middle">Search</text>
<text x="692.0" y="262.0" font-size="13" font-weight="400" fill="#5b6472" text-anchor="middle">filtered by user</text>
<rect x="800.0" y="214.0" width="168.0" height="64.0" rx="10" fill="#eee5fd" stroke="#6d32c9" stroke-width="1.5"/>
